[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surface-nvp-param"
version = "2.1.0"
description = "Injectivity-aware affine and spline NVP surface parameterization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "torch",
  "matplotlib",
  "PyYAML",
  "nflows",
]

[project.optional-dependencies]
test = ["pytest"]
usd = ["usd-core"]

[project.scripts]
surface-nvp-init = "scripts.init_uv:main"
surface-nvp-train = "scripts.train_injective_nvp:main"
surface-nvp-direct = "scripts.train_direct_uv:main"
surface-nvp-slim = "scripts.run_slim:main"
surface-nvp-check = "scripts.check_uv:main"
surface-nvp-summarize = "scripts.summarize_metrics:main"
surface-nvp-fit-target = "scripts.fit_nvp_to_target:main"

[tool.setuptools.packages.find]
include = ["surface_nvp*", "scripts"]
