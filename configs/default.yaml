init:
  method: tutte
  boundary: circle
  geometry_scale: true
  initial_uv:
model:
  coupling_type: affine
  num_layers: 6
  hidden_dim: 64
  mlp_layers: 3
  s_clamp: 2.0
  spline_bins: 8
  spline_bound: 1.1
train:
  seed: 0
  iters: 1000
  lr: 0.001
  check_interval: 25
  plateau_patience: 4
  lr_decay: 0.5
  min_lr: 0.000001
  boundary_weight: 0.0
  identity_weight: 0.001
  area_weight: 100.0
  device: cpu
  validation_device:
  intersection_batch_size: 262144
io:
  prim_path:
