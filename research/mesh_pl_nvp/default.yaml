init:
  boundary: circle
  geometry_scale: true
  initial_uv:

model:
  cycles: 4
  hidden_dim: 32
  conditioner_features: basic
  max_log_scale: 0.08
  max_shift_fraction: 0.04
  center_iterations: 12

train:
  seed: 20260830
  iters: 1000
  lr: 0.003
  device: cpu
  check_interval: 10
  gradient_clip: 10.0
  lr_schedule: adaptive-plateau
  min_lr: 0.0001
  plateau_window: 100
  plateau_patience: 2
  plateau_relative_threshold: 0.008
  plateau_factor: 0.5
  plateau_q_threshold: 0.97
  plateau_minimum_area_ratio: 0.25
  intersection_batch_size: 262144

scaffold:
  enabled: true
  scale: 1.1

io:
  prim_path:
  save_model: true
